<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edge Direct Switch</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body class="popup">
    <header class="bar">
      <div class="brand">
        <img src="icons/32.png" alt="" width="22" height="22" />
        <span data-i18n="extShort"></span>
      </div>
      <div class="master glass">
        <span id="alwaysOn-label" data-i18n="savedSites"></span>
        <input
          id="alwaysOn"
          type="checkbox"
          role="switch"
          class="switch small"
          aria-labelledby="alwaysOn-label"
        />
      </div>
    </header>

    <main>
      <section class="glass site">
        <div id="avatar" class="avatar" aria-hidden="true"></div>
        <div class="site-text">
          <div id="host" class="host"></div>
          <div id="status" class="status"><i class="dot"></i><span></span></div>
        </div>
      </section>

      <button id="toggle" class="big primary" disabled></button>
      <p id="hint" class="hint">
        <svg class="i i-info" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5M12 8h.01" />
        </svg>
        <svg class="i i-clock" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
        <svg class="i i-check" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="m8 12 3 3 5-6" />
        </svg>
        <span></span>
      </p>

      <section id="options" class="glass list" hidden>
        <div class="row">
          <span class="row-text">
            <span id="wide-label" data-i18n="optWide"></span>
            <small id="wide-desc"></small>
          </span>
          <input
            id="wide"
            type="checkbox"
            role="switch"
            class="switch"
            aria-labelledby="wide-label"
            aria-describedby="wide-desc"
          />
        </div>
        <div class="row">
          <span class="row-text">
            <span id="remember-label" data-i18n="optRemember"></span>
            <small id="rememberHint" data-i18n="rememberNeedsOn" hidden></small>
          </span>
          <input
            id="remember"
            type="checkbox"
            role="switch"
            class="switch"
            aria-labelledby="remember-label"
          />
        </div>
      </section>

      <div id="message" class="toast" role="status" hidden></div>
    </main>

    <footer class="foot">
      <button id="openSettings" class="pill">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h9m4 0h3M4 17h3m4 0h9" />
          <circle cx="15" cy="7" r="2" />
          <circle cx="9" cy="17" r="2" />
        </svg>
        <span data-i18n="settings"></span>
      </button>
      <span id="version" class="version"></span>
      <button id="count" class="pill"></button>
    </footer>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
