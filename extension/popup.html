<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edge Direct Switch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header class="bar">
      <div class="brand">
        <img src="icons/32.png" alt="" width="20" height="20" />
        <span data-i18n="extShort"></span>
      </div>
      <label class="inline-switch">
        <span data-i18n="savedSites"></span>
        <input id="alwaysOn" type="checkbox" role="switch" class="switch" />
      </label>
    </header>

    <main>
      <section class="card site">
        <div id="avatar" class="avatar" aria-hidden="true"></div>
        <div class="site-text">
          <div id="host" class="host"></div>
          <div id="status" class="status"><i class="dot"></i><span></span></div>
        </div>
      </section>

      <button id="toggle" class="primary big" disabled></button>
      <p id="hint" class="hint"></p>

      <section id="options" class="card list" hidden>
        <label class="row">
          <span id="wideLabel" class="row-text"></span>
          <input id="wide" type="checkbox" role="switch" class="switch" />
        </label>
        <label class="row">
          <span class="row-text">
            <span data-i18n="optRemember"></span>
            <small id="rememberHint" data-i18n="rememberNeedsOn" hidden></small>
          </span>
          <input id="remember" type="checkbox" role="switch" class="switch" />
        </label>
      </section>

      <div id="message" class="toast" role="status" hidden></div>
    </main>

    <footer class="foot">
      <button id="openSettings" class="link">
        <svg
          viewBox="0 0 24 24"
          width="15"
          height="15"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M4 7h9m4 0h3M4 17h3m4 0h9" />
          <circle cx="15" cy="7" r="2" />
          <circle cx="9" cy="17" r="2" />
        </svg>
        <span data-i18n="settings"></span>
      </button>
      <span id="version" class="muted"></span>
      <button id="count" class="link"></button>
    </footer>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
