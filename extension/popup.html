<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网站直连开关</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header class="brand">
      <img src="icons/48.png" alt="" />
      <div><strong>网站直连开关</strong><span>EDGE DIRECT SWITCH</span></div>
      <button id="settings" class="icon-button" title="打开设置" aria-label="打开设置">⚙</button>
    </header>
    <main>
      <div id="message" class="message" role="status" hidden></div>
      <section class="site-card">
        <div class="eyebrow">当前网站</div>
        <h1 id="host">正在读取…</h1>
        <div id="route" class="pill">正在检查</div>
        <p id="scope" class="muted"></p>
      </section>
      <div id="actions" class="stack">
        <button id="temporary" class="primary">临时直连 30 分钟</button>
        <button id="permanent" class="secondary">始终直连此网站</button>
        <button id="remove" class="secondary" hidden>删除此直连规则</button>
        <label class="check"><input type="checkbox" id="subdomains" /> 包含此域名的子域名</label>
        <label class="check"
          ><input type="checkbox" id="reload" checked />
          操作后刷新当前页（未保存的内容会丢失）</label
        >
      </div>
      <p class="notice">
        规则对同域名的所有标签页生效。临时规则在 30 分钟后或创建它的标签页关闭时结束。
      </p>
      <div class="proxy-line">
        <span id="endpoint"></span><button id="toggle" class="text-button">启用分流</button>
      </div>
      <p class="footnote">
        分流启用后：规则内网站直连，其余网站使用上方代理。其他应用继续使用原有设置。
      </p>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
