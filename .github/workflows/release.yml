name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run pack
      - name: Check tag and generate checksums
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'JSON.parse(require("fs").readFileSync("extension/manifest.json")).version')"
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "Direct Switch $GITHUB_REF_NAME · Edge & Chrome" --notes-file docs/RELEASE_NOTES.md
